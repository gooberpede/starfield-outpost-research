<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810">
<title>Population lifecycle and consumer boundaries</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466a82"/></marker></defs>
<rect width="1280" height="100%" fill="#f8fafc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#182d3a">
<text x="32" y="42" font-size="26" font-weight="600">Population lifecycle and consumer boundaries</text>
<rect x="32" y="100" width="360" height="100" rx="8" fill="white" stroke="#708da0"/>
<text x="47" y="127" font-size="16" >Cold ProcGen / new context</text>
<text x="47" y="151" font-size="16" >Map empty; visited empty</text>
<text x="47" y="175" font-size="16" >Successful unvisited miss constructs</text>
<rect x="470" y="100" width="360" height="100" rx="8" fill="white" stroke="#708da0"/>
<text x="485" y="127" font-size="16" >Retained source wrapper</text>
<text x="485" y="151" font-size="16" >Owned regions / copied points</text>
<text x="485" y="175" font-size="16" >Map hit or visited bypass: no generation</text>
<rect x="900" y="100" width="310" height="100" rx="8" fill="white" stroke="#708da0"/>
<text x="915" y="127" font-size="16" >Broad manager reset</text>
<text x="915" y="151" font-size="16" >Module +0x18 clears stores</text>
<text x="915" y="175" font-size="16" >Later demand may reconstruct</text>
<rect x="32" y="330" width="360" height="125" rx="8" fill="white" stroke="#708da0"/>
<text x="47" y="357" font-size="16" >Grid shift / source retirement</text>
<text x="47" y="381" font-size="16" >Retained overlaps can survive</text>
<text x="47" y="405" font-size="16" >Retirement removes map entry</text>
<text x="47" y="429" font-size="16" >Visited identity can remain</text>
<rect x="470" y="330" width="360" height="125" rx="8" fill="white" stroke="#708da0"/>
<text x="485" y="357" font-size="16" >Area updater → catalogue / UI</text>
<text x="485" y="381" font-size="16" >Domain/displacement refresh</text>
<text x="485" y="405" font-size="16" >Area predicate + ATMO / BIOM</text>
<text x="485" y="429" font-size="16" >List filters; asynchronous UI reads</text>
<rect x="900" y="330" width="310" height="125" rx="8" fill="white" stroke="#708da0"/>
<text x="915" y="357" font-size="16" >Candidate placement gate</text>
<text x="915" y="381" font-size="16" >Point predicate at raw XYZ</text>
<text x="915" y="405" font-size="16" >Intersect produced resources</text>
<text x="915" y="429" font-size="16" >Separate territory/collision gates</text>
<path d="M392 150L470 150" stroke="#466a82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="431.0" y="85" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="4">construct</text>
<path d="M830 150L900 150" stroke="#466a82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="865.0" y="85" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="4">reset</text>
<path d="M510 200L210 330" stroke="#466a82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360.0" y="257.0" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="4">ordinary shift</text>
<path d="M650 200L650 330" stroke="#466a82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662" y="257.0" font-size="12" text-anchor="start" paint-order="stroke" stroke="#f8fafc" stroke-width="4">area scan</text>
<path d="M800 200L1055 330" stroke="#466a82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="927.5" y="257.0" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="4">point scan</text>
<text x="32" y="710" font-size="15" >Static branches and conditional model outputs; arrows do not claim an observed gameplay chronology.</text>
<text x="32" y="735" font-size="15" >Retirement alone does not require regeneration. A retained visited key can suppress a later miss.</text>
</g></svg>
