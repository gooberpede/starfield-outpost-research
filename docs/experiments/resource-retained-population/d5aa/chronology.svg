<text x="36" y="710" font-family="Arial, sans-serif" font-size="15" fill="#8b5367">Shading: retained events after the first sampled loss boundary; lost events have no known individual times.</text>
<text x="36" y="739" font-family="Arial, sans-serif" font-size="16" fill="#8b5367">UNKNOWN: actual travel confirmation, target first query/mask, append and visual arrival instants.</text>
<text x="36" y="768" font-family="Arial, sans-serif" font-size="15" fill="#202b3d">9,957 queue-full losses; 13 QPC/admission inversions. A checkpoint is not a native transition.</text>
